<script>
document.getElementById('submitBtn').addEventListener('click', function() {
  var cccd = document.getElementById('cccdInput').value.trim();
  var msgDiv = document.getElementById('msg');
  var resultDiv = document.getElementById('result');
  var btn = document.getElementById('submitBtn');
  
  if (!cccd) {
    msgDiv.style.color = "#d90429";
    msgDiv.innerHTML = "⚠️ Vui lòng nhập số CCCD để tra cứu!";
    resultDiv.style.display = 'none';
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = "ĐANG TÌM...";
  msgDiv.style.color = "#555";
  msgDiv.innerHTML = "🔄 Hệ thống đang kết nối máy chủ, vui lòng đợi trong giây lát...";
  resultDiv.style.display = 'none';
  
  var webAppUrl = "https://script.google.com/macros/s/AKfycbwr5Q-BDMIy70OZ_Akr747xbFO7qfFmu4N19Q9X5r4qN1SsIWOw1j9EFjHcV0ppQDuiNQ/exec?cccd=" + encodeURIComponent(cccd);
  
  fetch(webAppUrl)
    .then(response => response.json())
    .then(data => {
      btn.disabled = false;
      btn.innerHTML = "Xem SBD";
      
      if (data.found) {
        msgDiv.style.color = "#1e7e34";
        msgDiv.innerHTML = "✅ Tra cứu thành công! Thí sinh ghi nhớ thông tin phòng thi và kết quả.";
        
        document.getElementById('resHoTen').innerText = data.hoTen;
        document.getElementById('resNgaySinh').innerText = data.ngaySinh;
        document.getElementById('resCCCD').innerText = cccd;
        document.getElementById('resHangXe').innerText = data.hangXe || "Không có";
        document.getElementById('resSBD').innerText = data.sbd || "Đang cập nhật";
        
        if (data.ghiChu) {
          document.getElementById('resGhiChu').innerText = data.ghiChu;
          document.getElementById('resGhiChu').style.display = 'block';
        } else {
          document.getElementById('resGhiChu').style.display = 'none';
        }
        
        resultDiv.style.display = 'block';
      } else {
        msgDiv.style.color = "#d90429";
        if (data.error) {
          msgDiv.innerHTML = "❌ Có lỗi hệ thống xảy ra hoặc kết nối bị nghẽn, vui lòng thử lại!";
          console.error("Lỗi Apps Script:", data.error);
        } else {
          msgDiv.innerHTML = "🔍 Không tìm thấy thông tin thí sinh phù hợp. Vui lòng kiểm tra lại số căn cước!";
        }
      }
    })
    .catch(error => {
      btn.disabled = false;
      btn.innerHTML = "Xem SBD";
      msgDiv.style.color = "#d90429";
      msgDiv.innerHTML = "❌ Không thể kết nối với máy chủ. Vui lòng kiểm tra đường truyền mạng!";
      console.error("Lỗi kết nối:", error);
    });
});

// THÊM ĐOẠN NÀY ĐỂ HỖ TRỢ BẤM ENTER
document.getElementById('cccdInput').addEventListener('keydown', function(event) {
  if (event.key === 'Enter') {
    event.preventDefault(); // Ngăn chặn hành vi mặc định (nếu có)
    document.getElementById('submitBtn').click(); // Kích hoạt sự kiện click của nút
  }
});
</script>
